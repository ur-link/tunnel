version: 2
# Grouped so each ecosystem opens at most ONE PR (one for version updates, one
# for security updates) — no mass PR storms. Actions are pinned to commit SHAs;
# Dependabot bumps the SHA + the "# vX.Y.Z" comment.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        applies-to: 'version-updates'
        patterns: ['*']
      all-security-dependencies:
        applies-to: 'security-updates'
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        applies-to: 'version-updates'
        patterns: ['*']
      all-security-dependencies:
        applies-to: 'security-updates'
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        applies-to: 'version-updates'
        patterns: ['*']
      all-security-dependencies:
        applies-to: 'security-updates'
        patterns: ['*']

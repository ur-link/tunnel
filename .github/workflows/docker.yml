name: docker

# Build and push the multi-arch image to GHCR and Docker Hub when a GitHub
# release is published, or on manual dispatch for a specific version.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.0.2 (default: the release tag)"
        required: false

permissions:
  contents: read

env:
  # GitHub forbids secrets.* in some if: expressions — surface presence flags once.
  HAS_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
  HAS_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - name: Resolve version
        id: ver
        env:
          REL: ${{ github.event.release.tag_name }}
          INP: ${{ inputs.version }}
        run: |
          v="${REL:-$INP}"
          v="${v#v}"
          # Validate as semver to avoid ref/tag injection into checkout below.
          if ! echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "invalid or missing version: '$v' (set the 'version' input or trigger via a release)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: urlinkbot
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
            docker.io/urlink/tunnel:${{ steps.ver.outputs.version }}
            docker.io/urlink/tunnel:latest

      - name: Notify Slack
        # !cancelled() → notify on success and failure, but skip superseded (cancelled) builds.
        if: ${{ !cancelled() && env.HAS_SLACK_WEBHOOK_URL == 'true' }}
        # Official, Slack-maintained action (replaces the now-archived 8398a7/action-slack).
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # Status-aware. Only trusted GitHub context fields are interpolated (injection-safe).
          payload: |
            text: "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} ${{ github.repository }} build ${{ job.status }} on ${{ github.ref_name }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *${{ github.repository }}* build *${{ job.status }}* on `${{ github.ref_name }}`\n*Workflow:* ${{ github.workflow }}  •  *By:* ${{ github.actor }}  •  *Commit:* `${{ github.sha }}`"
              - type: "actions"
                elements:
                  - type: "button"
                    text:
                      type: "plain_text"
                      text: "View run"
                    url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify Discord
        # !cancelled() → notify on success and failure; sarisia colors the embed by status.
        if: ${{ !cancelled() && env.HAS_DISCORD_WEBHOOK_URL == 'true' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: ${{ github.repository }}
          # Ping @here only when it needs attention (failure/cancelled); quiet on success.
          content: "${{ job.status != 'success' && '@here' || '' }}"
          username: GitHub Actions
          nofail: true

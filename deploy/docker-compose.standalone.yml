# Standalone server that terminates its own TLS via Let's Encrypt (tls-mode=acme,
# on-demand per-host certs — TLS-ALPN-01 / HTTP-01, no wildcard).
#
# Everything is persisted/mounted so restarts keep config + certs:
#   ./config/config.yaml   -> /etc/tunnel/config.yaml   (config; auto-discovered)
#   ./config/tokens        -> /etc/tunnel/tokens        (client tokens)
#   named volume tunnel-data -> /data                   (ACME cert cache: survives restarts)
#
# Setup:
#   1. Point *.tunnel.example.com AND connect.tunnel.example.com at this host.
#   2. Open ports 80, 443 and 7000 to the internet.
#   3. mkdir -p config && printf 'sometoken:myapp\n' > config/tokens
#      (optionally drop a config/config.yaml — see examples/server.config.yaml)
#   4. docker compose -f deploy/docker-compose.standalone.yml up -d
services:
  tunnel:
    image: ghcr.io/ur-link/tunnel:latest # or urlink/tunnel:latest
    container_name: tunnel
    restart: unless-stopped
    command: ["server"]
    environment:
      TUNNEL_DOMAIN: tunnel.example.com
      TUNNEL_TLS_MODE: acme
      TUNNEL_TLS_ACME_EMAIL: "[email protected]"
      TUNNEL_TLS_CACHE_DIR: /data/certs # persisted on the named volume
      TUNNEL_TOKENS_FILE: /etc/tunnel/tokens
      TUNNEL_LOG_FORMAT: json
    ports:
      - "80:80"
      - "443:443"
      - "7000:7000"
      - "127.0.0.1:9090:9090" # metrics: localhost only
    volumes:
      - ./config:/etc/tunnel:ro # config.yaml + tokens (read-only)
      - tunnel-data:/data # ACME cert cache (writable, persistent)

volumes:
  tunnel-data:

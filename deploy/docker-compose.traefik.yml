# Example: tunnel server behind Traefik (Traefik terminates TLS with a wildcard
# cert via DNS-01; the tunnel server runs plain HTTP and trusts X-Forwarded-*).
#
#   1. Point  *.tunnel.example.com  AND  connect.tunnel.example.com  at this host.
#   2. Fill in your DNS provider creds for the wildcard cert (see CF example below).
#   3. Put your client tokens in ./secrets/tokens (one "token:name1|name2" per line).
#   4. docker compose -f deploy/docker-compose.traefik.yml up -d --build
#
# Then from anywhere:
#   tunnel http 3000 --server wss://connect.tunnel.example.com --token <tok> --name myapp
services:
  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Wildcard cert via DNS-01 (HTTP-01 cannot issue *.domain). Example: Cloudflare.
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      - [email protected]
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?set your DNS provider token}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt

  tunnel:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["server"]
    environment:
      TUNNEL_DOMAIN: tunnel.example.com
      TUNNEL_TLS_MODE: "off"          # Traefik does TLS
      TUNNEL_TRUST_FORWARDED: "true"  # trust Traefik's X-Forwarded-*
      TUNNEL_HTTP_ADDR: ":80"
      TUNNEL_CONTROL_ADDR: ":7000"
      TUNNEL_METRICS_ADDR: ":9090"
      TUNNEL_TOKENS_FILE: /run/secrets/tokens
      TUNNEL_LOG_FORMAT: json
    secrets:
      - tokens
    labels:
      traefik.enable: "true"
      # Public edge: every <sub>.tunnel.example.com -> tunnel :80
      traefik.http.routers.edge.rule: "HostRegexp(`^[a-z0-9-]+\\.tunnel\\.example\\.com$`)"
      traefik.http.routers.edge.entrypoints: websecure
      traefik.http.routers.edge.tls.certresolver: le
      traefik.http.routers.edge.tls.domains[0].main: tunnel.example.com
      traefik.http.routers.edge.tls.domains[0].sans: "*.tunnel.example.com"
      traefik.http.routers.edge.service: edge-svc
      traefik.http.services.edge-svc.loadbalancer.server.port: "80"
      # Control plane (client WebSocket): connect.tunnel.example.com -> tunnel :7000
      traefik.http.routers.ctrl.rule: "Host(`connect.tunnel.example.com`)"
      traefik.http.routers.ctrl.entrypoints: websecure
      traefik.http.routers.ctrl.tls.certresolver: le
      traefik.http.routers.ctrl.service: ctrl-svc
      traefik.http.services.ctrl-svc.loadbalancer.server.port: "7000"

secrets:
  tokens:
    file: ./secrets/tokens

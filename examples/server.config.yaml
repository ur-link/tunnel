# Example server config. Place at ./config.yaml, ~/.tunnel/config.yaml,
# /etc/tunnel/config.yaml, or pass --config. Every key also works as a
# TUNNEL_* env var and a --flag (flags > env > file > defaults).

domain: tunnel.example.com      # tunnels become <name>.tunnel.example.com

# --- Listeners ---
http_addr: ":80"                # public HTTP edge
https_addr: ":443"              # public HTTPS edge (only used when tls_mode=acme)
control_addr: ":7000"           # client WebSocket control plane
metrics_addr: ":9090"           # Prometheus /metrics + /_tunnel/status

# --- TLS --- (see docs/TLS.md)
#   acme : standalone Let's Encrypt, on-demand per-host certs (TLS-ALPN-01 / HTTP-01).
#          No wildcard / DNS-01 (autocert limitation).
#   file : serve a cert you provide (e.g. a wildcard from DNS-01 tooling); hot-reloaded.
#   off  : plain HTTP behind a TLS-terminating proxy (Traefik/nginx/Caddy).
tls_mode: acme
acme_email: [email protected]   # tls_mode=acme
# tls_cache_dir: ~/.tunnel/certs   # tls_mode=acme cert cache (persist this!)
# tls_cert_file: /etc/tunnel/certs/fullchain.pem  # tls_mode=file
# tls_key_file:  /etc/tunnel/certs/key.pem        # tls_mode=file
trust_forwarded: false          # set true when behind Traefik/nginx (tls_mode=off)

# --- Auth (per-client tokens) ---
# Inline: "token" or "token:reserved1|reserved2", comma-separated.
# Prefer tokens_file (or TUNNEL_TOKENS_FILE) for secrets in production.
tokens: "sometoken:myapp|api, anothertoken"
# tokens_file: /etc/tunnel/tokens

# --- Tuning ---
random_name_len: 8
yamux_keepalive: 30s
yamux_window: 1048576           # 1 MiB per-stream flow-control window
read_header_timeout: 10s
idle_timeout: 120s

log_level: info                 # debug|info|warn|error
log_format: auto                # auto|text|json

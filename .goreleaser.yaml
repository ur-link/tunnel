version: 2
project_name: tunnel
before:
  hooks:
    - go mod tidy
builds:
  - id: tunnel
    main: ./cmd/tunnel
    binary: tunnel
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
archives:
  - id: tunnel
    # Stable, predictable names the npm launcher and platform-package builder rely on.
    name_template: "tunnel_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: "checksums.txt"
homebrew_casks:
  - name: tunnel
    repository:
      owner: ur-link
      name: homebrew-tap
    homepage: "https://github.com/ur-link/tunnel"
    description: "Self-hosted ngrok alternative — your own tunnel server and client"
    license: "MIT"
    binaries: [tunnel]
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tunnel"]
          end
release:
  github:
    owner: ur-link
    name: tunnel
